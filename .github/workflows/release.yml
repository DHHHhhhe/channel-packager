# 打一个 v<版本> 标签就自动构建并发布到 Releases，安装版客户端的自动更新就指向这里。
#
# 发一版的完整流程：
#     1. 改 app/package.json 的 version（必须比线上大，同号不会被升级）
#     2. 把这一版要说的写进 app/build/release-notes.md —— 它会成为 Release 正文，
#        也是客户端「发现新版本」时显示的更新内容
#     3. git add -A && git commit -m "chore: 升到 0.3.0"
#     4. git tag v0.3.0 && git push origin main --tags
# 推完标签不用再做别的：Actions 跑完会在 Releases 里出现一个新版本，
# 已装旧版的同事下次打开应用会自动下到它。
#
# 想先出草稿、人工点 Publish 才对外：在仓库的
# Settings → Secrets and variables → Actions → Variables 里加一个 EP_DRAFT=true，
# 或者在 Actions 页面手动触发这个工作流时把 draft 勾上。
#
# 注意：Release 的标签是 v<version>，和触发的标签必须一致，否则客户端找不到 latest.yml。

name: 发布新版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 出成草稿 Release（不对外可见，要去网页点 Publish）
        type: boolean
        default: false

# gh CLI 要用 GITHUB_TOKEN 建 Release、传附件
permissions:
  contents: write

# 同一个标签重复触发时，掐掉上一次没跑完的
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 装依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      # 内置运行时不入库，构建前必须重建：jre 从 Adoptium 下载后 jlink 裁剪（约 182 MB），
      # zipalign.exe 与 apksigner.jar 本机没装 Android SDK 就沿用仓库自带的那两份。
      - name: 准备内置运行时
        working-directory: app
        run: pnpm prepare:runtime

      # 构建与上传分成两步。electron-builder 自带的 GitHub 上传是并发的，会撞上
      # GitHub 的资产元数据竞态：同一个 tag 下建出两个 Release，资产被劈成两半
      # （v0.2.1 中过一次 —— 客户端请求的 download/v0.2.1/latest.yml 直接 404）。
      # 它还把失败静默吞掉，job 照样绿。gh CLI 是串行的，传完一个再传下一个，没这问题。
      #
      # publish.owner/repo 必须显式传：这两个值会被写进安装包的 resources/app-update.yml，
      # 客户端只认它。不传就落成 electron-builder.yml 里的值，CI 是 fork 来的仓库时可能不对
      # （v0.2.2 就是带着占位地址发出去的，装了的机器检查更新全部失败，只能手动重装）。
      - name: 构建（不发布）
        working-directory: app
        run: |
          pnpm build
          .\node_modules\.bin\electron-builder.CMD --win nsis --publish never "--config.publish.owner=${{ github.repository_owner }}" "--config.publish.repo=${{ github.event.repository.name }}"

      - name: 发布到 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          # 安装包在 Release 里必须用 GitHub 能接受的名字；latest.yml 的 path 写的也是这个，
          # 两边必须一致，否则客户端拿着清单下不到东西
          $setup = "channel-packager-setup-$version.exe"
          $draft = '${{ inputs.draft || vars.EP_DRAFT || 'false' }}' -eq 'true'

          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "Release $tag 已存在，只补传资产"
          } else {
            $args = @($tag, '--repo', $env:GITHUB_REPOSITORY, '--title', $version, '--notes-file', 'app/build/release-notes.md')
            if ($draft) { $args += '--draft' }
            gh release create @args
          }

          # 先复制成 GitHub 能接受的名字再传：中文产物名会被 GitHub 剥成「-0.2.2-.exe」，
          # 而 latest.yml 里的 path 写的是 $setup，两边对不上客户端就 404。
          # （gh 的 `文件#标签` 只加显示标签，不改资产名，别指望它。）
          $staging = "app/release/upload"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "app/release/渠道分包工具-$version-安装包.exe" "$staging/$setup" -Force
          Copy-Item "app/release/渠道分包工具-$version-安装包.exe.blockmap" "$staging/$setup.blockmap" -Force
          Copy-Item "app/release/latest.yml" "$staging/latest.yml" -Force

          # 逐个上传：gh 会等每个文件传完再传下一个。--clobber 让重跑同一个标签时覆盖旧资产
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber "$staging/$setup"
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber "$staging/$setup.blockmap"
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber "$staging/latest.yml"

          Write-Host "已上传：$setup / $setup.blockmap / latest.yml"

      - name: 提示
        if: ${{ !(inputs.draft || vars.EP_DRAFT) }}
        run: |
          Write-Host "已发布。安装包 + .blockmap + latest.yml 都在 Releases 里，"
          Write-Host "装过旧版的机器打开应用就会自己升级。"
