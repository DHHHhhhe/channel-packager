# 三种产物，用途不同（数据目录规则见 src/main/paths.ts）：
#
#   nsis     安装包。装一次之后从快捷方式开（约 0.35 秒），支持自动更新 —— 日常和分发的默认选择。
#   portable 单文件 exe。每次启动都要自解压到 %TEMP%（约 10 秒），发给不想装东西的人。
#   zip      解压即用。解压一次之后跑文件夹里的 exe（约 0.4 秒），留作绿色版。
#
# portable 的 data/ 必须落在 PORTABLE_EXECUTABLE_DIR（exe 真实所在目录），
# 不能用 app.getPath('exe') —— 那指向临时解压目录，用户加完配置一关就丢。
appId: com.example.channelpackager
productName: 渠道分包工具

# 这是 zip 目标的命名（portable 在下面单独指定 artifactName，不受这里影响）。
# 名字里写明用途：解压一次之后直接跑文件夹里的 exe，不用每次等自解压。
artifactName: ${productName}-${version}-解压即用.zip

# 只打包中文和英文语言包。Electron 自带 55 个 .pak 约 48 MB，
# 而便携版每次启动都要把它们完整解压一遍，留着纯属拖慢启动。
electronLanguages:
  - zh-CN
  - en-US

directories:
  output: release
  buildResources: build

# 构建前先拦一道：release/ 是构建产物目录，不该出现 data/ ——
# 那里面的 jks 副本与明文口令会被重建、清理或打包分享一起带走。
# 钩子实现在 scripts/before-pack.cjs，检测到就中止构建并提示先挪走。
beforePack: ./scripts/before-pack.cjs

files:
  - dist/**
  - dist-electron/**
  - package.json

# 内置运行时随包分发：目标机器不保证装有 Java 与 Android SDK
extraResources:
  - from: resources/bin
    to: bin

win:
  target:
    - nsis
    - portable
    - zip
  # build/icon.ico 由 scripts/make-icon.ps1 生成，改图形重跑该脚本即可
  icon: build/icon.ico

# 自动更新（electron-updater）去 GitHub Releases 取新版本。
#
# 下面 owner / repo 是**占位值**，正式发版由 scripts/release.ps1 覆盖：
# electron-builder 只从 package.json 的 repository 或 **app 目录下的** .git/config
# 推断账号与仓库名，而本仓库的 .git 在上一层（渠道工具/），它找不到 —— 实测会直接
# 构建失败（Cannot read properties of null (reading 'provider')），所以这里必须给值。
#
# 发版流程：
#     git remote add origin https://github.com/<你的账号>/<仓库名>.git
#     $env:GH_TOKEN = '<令牌>'        # 公开仓库勾 public_repo，私有仓库勾 repo
#     pwsh -File app/scripts/release.ps1
# release.ps1 会从 origin 读出账号/仓库名，用 -c.publish.owner=… -c.publish.repo=…
# 覆盖下面两个值，再 --publish always 上传；上传完 Release 默认是草稿，要去网页点 Publish。
#
# 只做本地构建、不发布：留着占位值即可（装出来的应用检查更新会报错，其他功能不受影响）。
# 客户端认的地址固化在安装包的 resources/app-update.yml 里，换地址要重新构建。
# 想临时换地址（不用重新打包）：在数据目录放一份 update.json
# （{"url":"http://内网服务器/渠道分包工具/"}），见 src/main/updater.ts。
publish:
  provider: github
  owner: your-account
  repo: your-repo

# Release 的正文。客户端「发现新版本」时显示的更新内容就是这里（见 src/main/updater.ts
# 的 releaseNotes）：构建时读这个文件，写进 GitHub Release 的 body。
# 路径相对 app/；文件缺失只是没有更新内容，不影响发版。
releaseInfo:
  releaseNotesFile: build/release-notes.md

nsis:
  # 向导式安装，让用户能自己选装到哪 —— allowToChangeInstallationDirectory
  # 只对向导式生效，所以 oneClick 必须是 false。
  #
  # 默认目录仍是 %LOCALAPPDATA%\Programs\channel-packager（模板拿 APP_FILENAME 拼的，
  # 与原来一键装的位置一模一样），已经装过的机器会读注册表里的 InstallLocation
  # 装回原目录，不会装出两份；自动更新走静默安装，不弹任何页面。
  # 数据目录另算：见 src/main/paths.ts 的 installedDataDir()。
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 保持 per-user：不写 Program Files，不需要管理员权限，也就没有 UAC 弹窗。
  # 代价是向导里会多一步「为所有用户 / 仅为我」的选择页。
  perMachine: false
  # 向导文案只留中文（electron-builder 模板自带 zh_CN 条目）
  installerLanguages:
    - zh_CN
  artifactName: 渠道分包工具-${version}-安装包.exe
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 渠道分包工具
  # 只写标记文件（见 build/installer.nsh），应用据此把数据放到安装目录之外。
  # 卸载时删的只有安装目录，渠道配置和 jks 留在 %LOCALAPPDATA%\渠道分包工具\data。
  include: build/installer.nsh

portable:
  artifactName: 渠道分包工具-${version}.exe
