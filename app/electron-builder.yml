# 免安装单文件 exe。portable 目标每次启动都会自解压到 %TEMP%，
# 因此 data/ 必须落在 PORTABLE_EXECUTABLE_DIR（exe 真实所在目录），
# 不能用 app.getPath('exe') —— 那指向临时解压目录，用户加完配置一关就丢。
appId: com.example.channelpackager
productName: 渠道分包工具

directories:
  output: release
  buildResources: build

# 构建前先拦一道：release/ 是构建产物目录，不该出现 data/ ——
# 那里面的 jks 副本与明文口令会被重建、清理或打包分享一起带走。
# 钩子实现在 scripts/before-pack.cjs，检测到就中止构建并提示先挪走。
beforePack: ./scripts/before-pack.cjs

files:
  - dist/**
  - dist-electron/**
  - package.json

# 内置运行时随包分发：目标机器不保证装有 Java 与 Android SDK
extraResources:
  - from: resources/bin
    to: bin

win:
  target: portable
  # build/icon.ico 由 scripts/make-icon.ps1 生成，改图形重跑该脚本即可
  icon: build/icon.ico

portable:
  artifactName: 渠道分包工具-${version}.exe
